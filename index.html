function act(a,p){
switch(a){
case 'go':nav(p);break;case 'play':startRun(S.max);break;
case 'lvl':p=+p;if(p>S.max){toast('Niveau verrouillé 🔒');break}startRun(p);break;

case 'sel':if(done)break;cur.sel=+p;document.querySelectorAll('.op').forEach(function(b,k){b.classList.toggle('sl',k===cur.sel)});$('#vb').disabled=false;break;

case 'skip':if(done)break;if(S.it.s<1){toast('Aucune aide « Passer » restante.');break}S.it.s--;S.run.qs[S.run.i]=build(S.run.lv,1)[0];loadQ();save();render();break;
case 'claim':var c=CH.filter(function(x){return x[0]===p})[0],st=c[8]?S.day.cl:S.cl;if(st[p]||c[5](S)<c[4]){toast('Objectif non atteint.');break}st[p]=1;S.coins+=c[6];S.lives+=c[7];save();beep(SND.win);conf(60);toast('🎁 +'+c[6]+' pièces'+(c[7]?' et +'+c[7]+' vie':''));render();break;
